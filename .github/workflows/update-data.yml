name: Update Dashboard Data

on:
  schedule:
    - cron: '0 2 * * *'  # daily 2 AM UTC
  workflow_dispatch:      # manual trigger
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas curl_cffi openpyxl

      - name: Fetch data (with one retry)
        run: |
          python fetch_data.py || (echo "first attempt failed, retrying in 30s..." && sleep 30 && python fetch_data.py)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.js data/raw
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push
          fi
